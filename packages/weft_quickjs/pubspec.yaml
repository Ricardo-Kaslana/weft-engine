name: weft_quickjs
description: QuickJS native runtime backend for Weft, driven through dart:ffi.
repository: https://github.com/Ricardo-Kaslana/weft-engine
issue_tracker: https://github.com/Ricardo-Kaslana/weft-engine/issues
topics:
  - flutter
  - javascript
  - quickjs
version: 0.7.0-dev.2
resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.5"

dependencies:
  ffi: ^2.2.0
  weft_runtime_api: ^0.7.0-dev.2

dev_dependencies:
  test: ^1.25.0
  weft_runtime_contract: ^0.7.0-dev.2

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

dev_dependencies:/n  weft_runtime_contract: ^0.7.0-dev.2
