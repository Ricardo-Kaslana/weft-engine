name: weft_quickjs
description: QuickJS native runtime backend for Weft, driven through dart:ffi.
version: 0.7.0-dev.1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.5"

dependencies:
  ffi: ^2.2.0
  weft_runtime_api:
    path: ../weft_runtime_api

dev_dependencies:
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
