version: 0.7.0-dev.1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.5"

dependencies:
  flutter:
    sdk: flutter
  weft_capabilities:
    path: ../weft_capabilities
  weft_document:
