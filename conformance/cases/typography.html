<style>
  .center { text-align: center; }
  .right { text-align: right; }
  .spaced { line-height: 1.8; }
</style>
<h1>一级标题 Heading</h1>
<h2>二级标题</h2>
<h3>三级标题</h3>
<p>普通文本包含 <strong>粗体</strong>、<em>斜体</em>、<u>下划线</u>、<s>删除线</s>、
<small>小字号</small>、<code>inline code</code>、H<sub>2</sub>O 和 x<sup>2</sup>。</p>
<p class="center">居中对齐的段落用于检查行宽与多行文本。</p>
<p class="right">右对齐段落。</p>
<p class="spaced">较大的行高会改变块高度，但不应改变字符顺序。</p>
<hr>
<p>分隔线之后还有一段文本。</p>
