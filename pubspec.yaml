name: weft_workspace
description: Workspace for the Weft controlled HTML rendering engine.
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

# Workspace-level tooling (tool/*.dart) drives the document package directly,
# e.g. `dart run tool/normalization_vectors.dart`.
dependencies:
  weft_document: any

workspace:
  - packages/weft_document
  - packages/weft_runtime_api
  - packages/weft_capabilities
  - packages/weft_engine
  - packages/weft_quickjs
  - packages/weft_runtime_fake
  - packages/weft_runtime_contract
  - packages/weft
  - example/weft_lab
  - example/weft_fallback
