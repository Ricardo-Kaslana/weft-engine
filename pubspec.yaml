name: weft_workspace
description: Workspace for the Weft controlled HTML rendering engine.
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - packages/weft_document
  - packages/weft_runtime_api
  - packages/weft_capabilities
  - packages/weft_engine
  - packages/weft_quickjs
  - packages/weft
  - example/weft_lab
