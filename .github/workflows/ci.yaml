name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Build QuickJS native library
        run: bash packages/weft_quickjs/tool/build_native.sh
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze workspace
        run: dart analyze
      - name: API doc coverage gate
        run: dart run tool/doc_coverage.dart
      - name: Run package tests
        run: dart run tool/verify.dart

  golden:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Compare committed Flutter pixel baselines
        working-directory: packages/weft_engine
        run: flutter test tool/golden_pixel_test.dart --timeout 120s
