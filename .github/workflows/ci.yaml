name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Build QuickJS native library
        run: bash packages/weft_quickjs/tool/build_native.sh

      - name: Verify QuickJS native library loads
        working-directory: packages/weft_quickjs
        run: dart run tool/verify_native.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze workspace
        run: dart analyze

      - name: API doc coverage gate
        run: dart run tool/doc_coverage.dart

      - name: Package publish dry-run gate
        run: dart run tool/pub_dry_run.dart

      - name: Run package tests
        run: dart run tool/verify.dart

      - name: Consumer Git dependency smoke
        run: dart run tool/consumer_smoke.dart

  golden:
    name: Pixel goldens (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Compare committed Flutter pixel baselines
        working-directory: packages/weft_engine
        run: flutter test tool/golden_pixel_test.dart --timeout 120s

  ios:
    name: iOS build (macOS)
    runs-on: macos-15
    # Device build, symbol scan, simulator boot and one smoke retry; each
    # external command has its own hard ceiling in tool/ios_smoke.dart.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Build iOS host, verify QuickJS symbols and run simulator smoke
        run: dart run tool/ios_smoke.dart --runtime
